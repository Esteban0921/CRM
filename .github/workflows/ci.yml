name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint build test e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (JS)
        run: pnpm format:check

      - name: Lint (JS)
        run: pnpm lint

      - name: Build (web)
        run: pnpm build

      - name: Unit and integration tests (JS)
        run: pnpm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @crm/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.5.x'

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --all-groups

      - name: Check formatting (API)
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Lint (API)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Unit tests (API)
        working-directory: apps/api
        run: uv run pytest
